      background-color: #FAF8F0;
      border: 1px solid rgba(26, 26, 26, 0.12);
      transition: all 0.2s ease;
    }
    .bento-input {
      background-color: #FFFFFF;
      border: 1px solid rgba(26, 26, 26, 0.18);
      color: #1A1A1A;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .bento-input:focus {
      border-color: #1A1A1A;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #FDFCF5; }
    ::-webkit-scrollbar-thumb { background: rgba(26, 26, 26, 0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(26, 26, 26, 0.4); }
  </style>
</head>
<body class="overflow-hidden">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// --- Firebase Config & Initialization ---
const firebaseConfig = {
  apiKey: "AIzaSyBz1d6Zehv5y2Jvqbhv9Y3C1gEhrcEkL0I",
  authDomain: "totot-restaurant-15a8c.firebaseapp.com",
  projectId: "totot-restaurant-15a8c",
  storageBucket: "totot-restaurant-15a8c.firebasestorage.app",
  messagingSenderId: "470989846823",

  measurementId: "G-JPPX9B2ST7"
};

let db = null;
try {
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  db = firebase.firestore();
} catch (e) {
  console.warn("Firebase initialization warning:", e);
}

// --- Initial Seed Data ---
const INITIAL_MENU = [
  { id: '1', name: 'Totot Special Kitfo', description: 'Finely minced beef with seasoned butter, mitmita, served with ayib and gomen.', price: 520, category: 'specialties', image: 'https://raw.githubusercontent.com/Tototkitfo/Totot-kitfo/main/caption.jpg', available: true, isFeatured: true, prepTimeMinutes: 15 },
  { id: '2', name: 'Kitfo Leb-Leb (Lightly Warmed)', description: 'Tender beef slightly warmed in spiced clarified butter with korarima.', price: 480, category: 'specialties', image: 'https://raw.githubusercontent.com/Tototkitfo/Totot-kitfo/main/caption.jpg', available: true, isFeatured: false, prepTimeMinutes: 12 },
  { id: '3', name: 'Gored Gored', description: 'Lean cubed beef tossed in warm awaze and herb-infused butter.', price: 490, category: 'specialties', image: 'https://raw.githubusercontent.com/Tototkitfo/Totot-kitfo/main/caption.jpg', available: true, isFeatured: false, prepTimeMinutes: 10 },
  { id: '4', name: 'Dulet Special', description: 'Finely diced tripe, liver, and lean beef sautéed with onion and peppers.', price: 410, category: 'specialties', image: 'https://raw.githubusercontent.com/Tototkitfo/Totot-kitfo/main/caption.jpg', available: true, isFeatured: false, prepTimeMinutes: 18 },
  { id: '5', name: 'Gomen Besiga', description: 'Collard greens slow-braised with prime beef cuts and garlic.', price: 380, category: 'specialties', image: 'https://raw.githubusercontent.com/Tototkitfo/Totot-kitfo/main/Gomen_besiga.jpg', available: true, isFeatured: false, prepTimeMinutes: 20 },
  { id: '6', name: 'Fresh Ayib with Mitmita', description: 'House-made Ethiopian herbal cottage cheese.', price: 120, category: 'sides', image: 'https://raw.githubusercontent.com/Tototkitfo/Totot-kitfo/main/caption.jpg', available: true, isFeatured: false, prepTimeMinutes: 5 },
  { id: '7', name: 'Warm Kocho Flatbread', description: 'Freshly baked enset bread, crispy outside with deep aroma.', price: 80, category: 'sides', image: 'https://raw.githubusercontent.com/Tototkitfo/Totot-kitfo/main/caption.jpg', available: true, isFeatured: false, prepTimeMinutes: 5 },
  { id: '8', name: 'Jebena Coffee Ceremony', description: 'Clay pot roasted organic Yirgacheffe coffee served table-side.', price: 250, category: 'drinks', image: 'https://raw.githubusercontent.com/Tototkitfo/Totot-kitfo/main/caption.jpg', available: true, isFeatured: true, prepTimeMinutes: 15 },
  { id: '9', name: 'Artisanal Tej (Honey Wine)', description: 'Traditional honey wine fermented in-house with gesho.', price: 190, category: 'drinks', image: 'https://raw.githubusercontent.com/Tototkitfo/Totot-kitfo/main/caption.jpg', available: true, isFeatured: false, prepTimeMinutes: 5 }
];

const INITIAL_RESERVATIONS = [
  { id: 'res-101', customerName: 'Dr. Yohannes Berhane', contactPhone: '+251 91 123 4567', partySize: 6, date: '2026-08-26', time: '19:30', status: 'Confirmed', isVIP: true, isCorporate: true, specialRequests: 'Mesob table by the Jebena coffee setup, mild spice.', createdAt: new Date().toISOString() },
  { id: 'res-102', customerName: 'Sara Mengistu', contactPhone: '+251 92 884 9102', partySize: 4, date: '2026-08-26', time: '20:00', status: 'Pending', isVIP: false, isCorporate: false, specialRequests: 'Birthday celebration, extra kocho.', createdAt: new Date().toISOString() },
  { id: 'res-103', customerName: 'Abebe Tadesse', contactPhone: '+251 93 450 1199', partySize: 2, date: '2026-08-26', time: '18:45', status: 'Confirmed', isVIP: false, isCorporate: false, specialRequests: 'Leb-leb kitfo preferred.', createdAt: new Date().toISOString() },
  { id: 'res-104', customerName: 'Hilton Addis Delegation', contactPhone: '+251 11 517 0000', partySize: 12, date: '2026-08-27', time: '13:00', status: 'Confirmed', isVIP: true, isCorporate: true, specialRequests: 'Full VIP Mesob hall booking with coffee ritual.', createdAt: new Date().toISOString() }
];

const INITIAL_SETTINGS = {
  brandName: 'Totot Cultural Restaurant',
  locationTag: 'Gerji, Addis Ababa',
  address: '2R54+2W4, Gerji Imperial Street, Bole Sub-City, Addis Ababa, Ethiopia',
  phone: '+251 11 646 0718',
  email: 'concierge@tototrestaurant.com',
  openTime: '08:00',
  closeTime: '23:30',
  hoursType: '24hours',
  headline: 'Authentic Gurage Dining & Kitfo Craft'
};

// --- Main App Component ---
function App() {
  const [currentTab, setCurrentTab] = useState('dashboard');
  const [menuItems, setMenuItems] = useState(INITIAL_MENU);
  const [reservations, setReservations] = useState(INITIAL_RESERVATIONS);
  const [settings, setSettings] = useState(INITIAL_SETTINGS);
  const [searchQuery, setSearchQuery] = useState('');
  
  // Modals
  const [newResOpen, setNewResOpen] = useState(false);
  const [menuModalOpen, setMenuModalOpen] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [resDetails, setResDetails] = useState(null);
  const [firebaseModalOpen, setFirebaseModalOpen] = useState(false);

  // Real-time Firestore Listeners
  useEffect(() => {
    if (!db) return;

    // Listen to reservations from Firestore
    const unsubRes = db.collection('reservations').onSnapshot(snap => {
      if (!snap.empty) {
        const list = [];
        snap.forEach(doc => {
          const d = doc.data();
          list.push({
            id: doc.id,
            customerName: d.customerName || d.name || 'Guest',
            contactPhone: d.contactPhone || d.phone || '',
            partySize: Number(d.partySize || d.guests || 2),
            date: d.date || '',
            time: d.time || '',
            status: d.status || 'Pending',
            isVIP: !!d.isVIP,
            isCorporate: !!d.isCorporate,
            specialRequests: d.specialRequests || '',
            createdAt: d.createdAt || new Date().toISOString()
          });
        });
        setReservations(list);
      }
    });

    // Listen to menu items from Firestore
    const unsubMenu = db.collection('menu_items').onSnapshot(snap => {
      if (!snap.empty) {
        const list = [];
        snap.forEach(doc => {
          list.push({ id: doc.id, ...doc.data() });
        });
        setMenuItems(list);
      }
    });

    return () => {
      unsubRes();
      unsubMenu();
    };
  }, []);

  // Handlers
  const handleCreateReservation = async (data) => {
    const newRes = {
      ...data,
      id: `res-${Date.now()}`,
      status: 'Confirmed',
      createdAt: new Date().toISOString()
    };
    setReservations(prev => [newRes, ...prev]);
    if (db) {
      try {
        await db.collection('reservations').add(newRes);
      } catch (e) { console.error(e); }
    }
    setNewResOpen(false);
  };

  const handleUpdateStatus = async (id, status) => {
    setReservations(prev => prev.map(r => r.id === id ? { ...r, status } : r));
    if (db) {
      try {
        await db.collection('reservations').doc(id).update({ status });
      } catch (e) { console.error(e); }
    }
  };

  const handleDeleteReservation = async (id) => {
    setReservations(prev => prev.filter(r => r.id !== id));
    if (db) {
      try {
        await db.collection('reservations').doc(id).delete();
      } catch (e) { console.error(e); }
    }
    setResDetails(null);
  };

  const handleSaveMenuItem = async (item) => {
    if (editItem) {
      const updated = { ...editItem, ...item };
      setMenuItems(prev => prev.map(m => m.id === editItem.id ? updated : m));
      if (db) await db.collection('menu_items').doc(editItem.id).set(updated, { merge: true });
    } else {
      const created = { ...item, id: `item-${Date.now()}` };
      setMenuItems(prev => [created, ...prev]);
      if (db) await db.collection('menu_items').doc(created.id).set(created);
    }
    setMenuModalOpen(false);
    setEditItem(null);
  };

  const handleToggleMenuAvail = async (id) => {
    const item = menuItems.find(m => m.id === id);
    if (!item) return;
    const updated = { ...item, available: !item.available };
    setMenuItems(prev => prev.map(m => m.id === id ? updated : m));
    if (db) await db.collection('menu_items').doc(id).set(updated, { merge: true });
  };

  const handleDeleteMenuItem = async (id) => {
    if (!confirm('Remove this dish from menu?')) return;
    setMenuItems(prev => prev.filter(m => m.id !== id));
    if (db) await db.collection('menu_items').doc(id).delete();
  };

  // Metrics
  const confirmedCount = reservations.filter(r => r.status === 'Confirmed').length;
  const pendingCount = reservations.filter(r => r.status === 'Pending').length;
  const totalCovers = reservations.filter(r => r.status === 'Confirmed').reduce((acc, r) => acc + r.partySize, 0);

  return (
    <div className="flex h-screen w-screen overflow-hidden bg-[#FDFCF5] text-[#1A1A1A]">
      {/* SIDEBAR */}
      <aside className="w-64 border-r border-[#1A1A1A]/10 bg-[#FAF8F0] flex flex-col justify-between p-4 shrink-0">
        <div>
          {/* Logo */}
          <div className="px-3 py-3 border-b border-[#1A1A1A]/10 mb-4 flex items-center justify-between">
            <div>
              <div className="text-[9px] font-bold tracking-[0.25em] uppercase text-[#1A1A1A]/50">Console</div>
              <h1 className="font-serif italic text-[22px] font-normal text-[#1A1A1A]">Totot Cultural</h1>
            </div>
            <span className="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
          </div>

          {/* Navigation */}
          <nav className="space-y-1">
            {[
              { id: 'dashboard', label: 'Overview', icon: '📊' },
              { id: 'reservations', label: 'Reservations', icon: '📅', badge: pendingCount },
              { id: 'menu', label: 'Menu CMS', icon: '🍲' },
              { id: 'analytics', label: 'Analytics', icon: '📈' },
              { id: 'settings', label: 'Settings & Bridge', icon: '⚙️' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setCurrentTab(tab.id)}
                className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-md text-[12px] font-bold uppercase tracking-wider transition-all ${
                  currentTab === tab.id
                    ? 'bg-[#1A1A1A] text-[#FDFCF5] shadow-sm'
                    : 'text-[#1A1A1A]/70 hover:bg-[#EFECE5] hover:text-[#1A1A1A]'
                }`}
              >
                <div className="flex items-center gap-2.5">
                  <span>{tab.icon}</span>
                  <span>{tab.label}</span>
                </div>
                {tab.badge > 0 && (
                  <span className="px-2 py-0.5 rounded-full text-[10px] bg-amber-200 text-amber-900">
                    {tab.badge}
                  </span>
                )}
              </button>
            ))}
          </nav>
        </div>

        {/* Sidebar Footer */}
        <div className="space-y-2 pt-4 border-t border-[#1A1A1A]/10">
          <button
            onClick={() => setNewResOpen(true)}
            className="w-full py-2.5 bg-[#1A1A1A] text-[#FDFCF5] hover:bg-[#333333] rounded-md text-[11px] font-bold tracking-[0.2em] uppercase transition-all shadow-sm flex items-center justify-center gap-2"
          >
            <span>+</span>
            <span>New Booking</span>
          </button>

          <button
            onClick={() => setFirebaseModalOpen(true)}
            className="w-full py-2 px-3 rounded-md bg-[#EFECE5] border border-[#1A1A1A]/10 flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-[#1A1A1A]"
          >
            <span className="flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
              Firestore Live
            </span>
            <span className="font-mono text-[9px] text-[#1A1A1A]/60">Sync Active</span>
          </button>
        </div>
      </aside>

      {/* MAIN VIEW CONTAINER */}
      <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-[#FDFCF5]">
        {/* TOP BAR */}
        <header className="h-16 border-b border-[#1A1A1A]/10 px-6 flex items-center justify-between bg-[#FDFCF5] shrink-0">
          <div className="flex items-center gap-3">
            <h2 className="font-serif italic text-[20px] capitalize text-[#1A1A1A]">
              {currentTab === 'menu' ? 'Menu Catalogue CMS' : currentTab}
            </h2>
            <span className="text-[11px] font-mono text-[#1A1A1A]/50 bg-[#EFECE5] px-2 py-0.5 rounded">
              Gerji Main Hall
            </span>
          </div>

          <div className="flex items-center gap-4">
            <input
              type="text"
              placeholder="Search bookings or dishes..."
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              className="bento-input px-3 py-1.5 rounded-md text-[12px] w-56 placeholder-[#1A1A1A]/40"
            />
            <div className="text-[11px] font-mono text-[#1A1A1A]/70 hidden sm:block">
              {new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}
            </div>
          </div>
        </header>

        {/* VIEW ROUTER BODY */}
        <main className="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
          {/* 1. DASHBOARD VIEW */}
          {currentTab === 'dashboard' && (
            <div className="space-y-6">
              {/* Metric Bento Cards */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bento-card p-5 rounded-md">
                  <div className="text-[10px] font-bold uppercase tracking-[0.2em] text-[#1A1A1A]/50 mb-1">Total Bookings</div>
                  <div className="font-serif text-[28px] font-bold text-[#1A1A1A]">{reservations.length}</div>
                  <div className="text-[11px] text-emerald-700 font-medium mt-1">✓ {confirmedCount} Confirmed</div>
                </div>

                <div className="bento-card p-5 rounded-md">
                  <div className="text-[10px] font-bold uppercase tracking-[0.2em] text-[#1A1A1A]/50 mb-1">Expected Covers</div>
                  <div className="font-serif text-[28px] font-bold text-[#1A1A1A]">{totalCovers} <span className="text-[14px] font-sans font-normal text-[#1A1A1A]/60">Guests</span></div>
                  <div className="text-[11px] text-[#1A1A1A]/70 font-medium mt-1">Daily Mesob Capacity</div>
                </div>

                <div className="bento-card p-5 rounded-md">
                  <div className="text-[10px] font-bold uppercase tracking-[0.2em] text-[#1A1A1A]/50 mb-1">Pending Inquiries</div>
                  <div className="font-serif text-[28px] font-bold text-amber-800">{pendingCount}</div>
                  <div className="text-[11px] text-amber-800/80 font-medium mt-1">Requires Confirmation</div>
                </div>

                <div className="bento-card p-5 rounded-md">
                  <div className="text-[10px] font-bold uppercase tracking-[0.2em] text-[#1A1A1A]/50 mb-1">Menu Offerings</div>
                  <div className="font-serif text-[28px] font-bold text-[#1A1A1A]">{menuItems.length} <span className="text-[14px] font-sans font-normal text-[#1A1A1A]/60">Dishes</span></div>
                  <div className="text-[11px] text-[#1A1A1A]/70 font-medium mt-1">Real-time Synced</div>
                </div>
              </div>

              {/* Recent Bookings Table */}
              <div className="bento-card p-6 rounded-md">
                <div className="flex items-center justify-between mb-4 border-b border-[#1A1A1A]/10 pb-3">
                  <div>
                    <h3 className="font-serif italic text-[18px] text-[#1A1A1A]">Recent Dining Bookings</h3>
                    <p className="text-[11px] text-[#1A1A1A]/60">Live feed from both this console and your consumer website</p>
                  </div>
                  <button
                    onClick={() => setCurrentTab('reservations')}
                    className="text-[11px] font-bold uppercase tracking-wider text-[#1A1A1A] hover:underline"
                  >
                    View All →
                  </button>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-[13px]">
                    <thead>
                      <tr className="border-b border-[#1A1A1A]/10 text-[10px] uppercase tracking-wider text-[#1A1A1A]/50">
                        <th className="py-2.5">Guest</th>
                        <th className="py-2.5">Party</th>
                        <th className="py-2.5">Date & Time</th>
                        <th className="py-2.5">Status</th>
                        <th className="py-2.5 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#1A1A1A]/5">
                      {reservations.slice(0, 5).map(res => (
                        <tr key={res.id} className="hover:bg-[#FFFFFF]/60 transition-colors">
                          <td className="py-3 font-bold text-[#1A1A1A]">
                            <div className="flex items-center gap-2">
                              <span>{res.customerName}</span>
                              {res.isVIP && <span className="px-1.5 py-0.2 rounded text-[9px] bg-[#1A1A1A] text-[#FDFCF5] font-bold">VIP</span>}
                            </div>
                            <div className="text-[11px] text-[#1A1A1A]/60 font-mono font-normal">{res.contactPhone}</div>
                          </td>
                          <td className="py-3">{res.partySize} Guests</td>
                          <td className="py-3 font-mono text-[12px]">{res.date} • {res.time}</td>
                          <td className="py-3">
                            <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider border ${
                              res.status === 'Confirmed' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' :
                              res.status === 'Pending' ? 'bg-amber-50 text-amber-800 border-amber-300' :
                              res.status === 'Completed' ? 'bg-[#1A1A1A] text-[#FDFCF5] border-[#1A1A1A]' :
                              'bg-red-50 text-red-800 border-red-300'
                            }`}>
                              {res.status}
                            </span>
                          </td>
                          <td className="py-3 text-right">
                            <button
                              onClick={() => setResDetails(res)}
                              className="px-2.5 py-1 text-[11px] font-bold border border-[#1A1A1A]/15 hover:bg-[#EFECE5] rounded"
                            >
                              Manage
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* 2. RESERVATIONS VIEW */}
          {currentTab === 'reservations' && (
            <div className="space-y-6">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h3 className="font-serif italic text-[22px] text-[#1A1A1A]">Table & Mesob Reservations</h3>
                  <p className="text-[12px] text-[#1A1A1A]/60">Manage guest lists, party sizes, and dining statuses</p>
                </div>
                <button
                  onClick={() => setNewResOpen(true)}
                  className="px-4 py-2 bg-[#1A1A1A] text-[#FDFCF5] hover:bg-[#333333] rounded-md text-[11px] font-bold tracking-[0.2em] uppercase transition-all shadow-sm"
                >
                  + Add Reservation
                </button>
              </div>

              <div className="bento-card rounded-md overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-[13px]">
                    <thead>
                      <tr className="bg-[#EFECE5]/60 border-b border-[#1A1A1A]/10 text-[10px] uppercase tracking-wider text-[#1A1A1A]/60">
                        <th className="py-3 px-4">Patron Name</th>
                        <th className="py-3 px-4">Contact</th>
                        <th className="py-3 px-4">Party Size</th>
                        <th className="py-3 px-4">Date & Time</th>
                        <th className="py-3 px-4">Special Requests</th>
                        <th className="py-3 px-4">Status</th>
                        <th className="py-3 px-4 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#1A1A1A]/5">
                      {reservations
                        .filter(r => r.customerName.toLowerCase().includes(searchQuery.toLowerCase()) || r.contactPhone.includes(searchQuery))
                        .map(res => (
                          <tr key={res.id} className="hover:bg-[#FFFFFF] transition-colors">
                            <td className="py-3 px-4 font-bold text-[#1A1A1A]">
                              {res.customerName}
                              {res.isVIP && <span className="ml-2 px-1.5 py-0.5 rounded text-[9px] bg-[#1A1A1A] text-[#FDFCF5] font-bold">VIP</span>}
                            </td>
                            <td className="py-3 px-4 font-mono text-[12px] text-[#1A1A1A]/80">{res.contactPhone}</td>
                            <td className="py-3 px-4 font-bold">{res.partySize}</td>
                            <td className="py-3 px-4 font-mono text-[12px]">{res.date} at {res.time}</td>
                            <td className="py-3 px-4 text-[12px] text-[#1A1A1A]/70 max-w-xs truncate italic">
                              "{res.specialRequests || 'None'}"
                            </td>
                            <td className="py-3 px-4">
                              <select
                                value={res.status}
                                onChange={(e) => handleUpdateStatus(res.id, e.target.value)}
                                className="text-[11px] font-bold uppercase rounded border border-[#1A1A1A]/20 bg-[#FFFFFF] px-2 py-1"
                              >
                                <option value="Confirmed">✓ Confirmed</option>
                                <option value="Pending">⏳ Pending</option>
                                <option value="Completed">🏁 Completed</option>
                                <option value="Cancelled">✕ Cancelled</option>
                              </select>
                            </td>
                            <td className="py-3 px-4 text-right">
                              <button
                                onClick={() => setResDetails(res)}
                                className="px-3 py-1 bg-[#1A1A1A] text-[#FDFCF5] rounded text-[11px] font-bold uppercase"
                              >
                                View
                              </button>
                            </td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* 3. MENU CMS VIEW */}
          {currentTab === 'menu' && (
            <div className="space-y-6">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h3 className="font-serif italic text-[22px] text-[#1A1A1A]">Culinary Offerings & Price Management</h3>
                  <p className="text-[12px] text-[#1A1A1A]/60">Edits update the live consumer website instantly via Firestore</p>
                </div>
                <button
                  onClick={() => { setEditItem(null); setMenuModalOpen(true); }}
                  className="px-4 py-2 bg-[#1A1A1A] text-[#FDFCF5] hover:bg-[#333333] rounded-md text-[11px] font-bold tracking-[0.2em] uppercase transition-all shadow-sm"
                >
                  + Add Menu Item
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {menuItems.map(item => (
                  <div key={item.id} className="bento-card p-4 rounded-md flex flex-col justify-between shadow-2xs">
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-[9px] font-bold uppercase tracking-wider text-[#1A1A1A]/50 bg-[#EFECE5] px-2 py-0.5 rounded">
                          {item.category}
                        </span>
                        <div className="font-mono font-bold text-[15px] text-[#1A1A1A]">{item.price} ETB</div>
                      </div>

                      <h4 className="font-serif font-bold text-[17px] text-[#1A1A1A] mb-1">{item.name}</h4>
                      <p className="text-[12px] text-[#1A1A1A]/70 leading-relaxed mb-3 line-clamp-2">{item.description}</p>
                    </div>

                    <div className="pt-3 border-t border-[#1A1A1A]/10 flex items-center justify-between">
                      <label className="flex items-center gap-2 text-[11px] font-bold uppercase cursor-pointer">
                        <input
                          type="checkbox"
                          checked={item.available}
                          onChange={() => handleToggleMenuAvail(item.id)}
                          className="rounded text-[#1A1A1A]"
                        />
                        <span>{item.available ? 'Available' : 'Sold Out'}</span>
                      </label>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => { setEditItem(item); setMenuModalOpen(true); }}
                          className="px-2.5 py-1 text-[11px] font-bold border border-[#1A1A1A]/20 hover:bg-[#EFECE5] rounded"
                        >
                          Edit
                        </button>
                        <button
                          onClick={() => handleDeleteMenuItem(item.id)}
                          className="px-2 py-1 text-[11px] font-bold text-red-700 hover:bg-red-50 rounded"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 4. ANALYTICS VIEW */}
          {currentTab === 'analytics' && (
            <div className="space-y-6">
              <div className="bento-card p-6 rounded-md">
                <h3 className="font-serif italic text-[20px] text-[#1A1A1A] mb-2">Dining Room Demand & Peak Hours</h3>
                <p className="text-[12px] text-[#1A1A1A]/60 mb-6">Aggregate distribution of banquet and lunch bookings</p>
                
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                  <div className="p-4 bg-[#FFFFFF] rounded border border-[#1A1A1A]/10">
                    <div className="text-[10px] font-bold uppercase text-[#1A1A1A]/50">Lunch Service</div>
                    <div className="font-serif text-[24px] font-bold text-[#1A1A1A] mt-1">35%</div>
                  </div>
                  <div className="p-4 bg-[#FFFFFF] rounded border border-[#1A1A1A]/10">
                    <div className="text-[10px] font-bold uppercase text-[#1A1A1A]/50">Dinner Peak</div>
                    <div className="font-serif text-[24px] font-bold text-[#1A1A1A] mt-1">55%</div>
                  </div>
                  <div className="p-4 bg-[#FFFFFF] rounded border border-[#1A1A1A]/10">
                    <div className="text-[10px] font-bold uppercase text-[#1A1A1A]/50">Late Night / 24H</div>
                    <div className="font-serif text-[24px] font-bold text-[#1A1A1A] mt-1">10%</div>
                  </div>
                  <div className="p-4 bg-[#FFFFFF] rounded border border-[#1A1A1A]/10">
                    <div className="text-[10px] font-bold uppercase text-[#1A1A1A]/50">VIP & Corporate</div>
                    <div className="font-serif text-[24px] font-bold text-[#1A1A1A] mt-1">42%</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 5. SETTINGS & BRIDGE VIEW */}
          {currentTab === 'settings' && (
            <div className="space-y-6 max-w-2xl">
              <div className="bento-card p-6 rounded-md">
                <div className="flex items-center justify-between border-b border-[#1A1A1A]/10 pb-3 mb-4">
                  <h3 className="font-serif italic text-[20px] text-[#1A1A1A]">Firebase Cloud Database Bridge</h3>
                  <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold uppercase">Connected</span>
                </div>
                <p className="text-[13px] text-[#1A1A1A]/70 mb-4 leading-relaxed">
                  Both your consumer website and this management console are synced in real-time through Google Firebase Firestore.
                </p>
                <div className="p-3 bg-[#FFFFFF] rounded border border-[#1A1A1A]/10 font-mono text-[12px] space-y-1 mb-4">
                  <div><strong>Project:</strong> {firebaseConfig.projectId}</div>
                  <div><strong>Auth Domain:</strong> {firebaseConfig.authDomain}</div>
                </div>
                <button
                  onClick={() => setFirebaseModalOpen(true)}
                  className="w-full py-2 bg-[#1A1A1A] text-[#FDFCF5] hover:bg-[#333333] rounded text-[11px] font-bold uppercase tracking-wider"
                >
                  View Integration Details & Script
                </button>
              </div>
            </div>
          )}
        </main>
      </div>

      {/* MODAL 1: NEW RESERVATION */}
      {newResOpen && (
        <div className="fixed inset-0 bg-[#1A1A1A]/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-[#FDFCF5] border border-[#1A1A1A]/15 rounded-md w-full max-w-md p-6 space-y-4 shadow-xl">
            <h3 className="font-serif italic text-[20px]">New Reservation Record</h3>
            <form onSubmit={(e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              handleCreateReservation({
                customerName: fd.get('name'),
                contactPhone: fd.get('phone'),
                partySize: Number(fd.get('guests')),
                date: fd.get('date'),
                time: fd.get('time'),
                specialRequests: fd.get('notes'),
                isVIP: fd.get('vip') === 'on'
              });
            }} className="space-y-3 text-[13px]">
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Patron Full Name</label>
                <input required name="name" placeholder="Dr. Yohannes Berhane" className="bento-input w-full p-2 rounded" />
              </div>
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Contact Phone</label>
                <input required name="phone" placeholder="+251 91 123 4567" className="bento-input w-full p-2 rounded" />
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Party</label>
                  <input required name="guests" type="number" defaultValue="2" min="1" className="bento-input w-full p-2 rounded" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Date</label>
                  <input required name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="bento-input w-full p-2 rounded text-[11px]" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Time</label>
                  <input required name="time" type="time" defaultValue="19:00" className="bento-input w-full p-2 rounded text-[11px]" />
                </div>
              </div>
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Special Requests</label>
                <input name="notes" placeholder="e.g. Mesob table, mild spice" className="bento-input w-full p-2 rounded" />
              </div>
              <div className="pt-1">
                <label className="flex items-center gap-2 text-[12px] font-bold uppercase cursor-pointer">
                  <input type="checkbox" name="vip" />
                  <span>VIP Guest Designation</span>
                </label>
              </div>
              <div className="flex justify-end gap-2 pt-3 border-t border-[#1A1A1A]/10">
                <button type="button" onClick={() => setNewResOpen(false)} className="px-4 py-2 border border-[#1A1A1A]/20 rounded text-[11px] font-bold uppercase">Cancel</button>
                <button type="submit" className="px-5 py-2 bg-[#1A1A1A] text-[#FDFCF5] rounded text-[11px] font-bold uppercase">Confirm</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* MODAL 2: MENU ITEM CMS */}
      {menuModalOpen && (
        <div className="fixed inset-0 bg-[#1A1A1A]/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-[#FDFCF5] border border-[#1A1A1A]/15 rounded-md w-full max-w-md p-6 space-y-4 shadow-xl">
            <h3 className="font-serif italic text-[20px]">{editItem ? 'Edit Dish Offering' : 'New Dish Offering'}</h3>
            <form onSubmit={(e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              handleSaveMenuItem({
                name: fd.get('name'),
                description: fd.get('desc'),
                price: Number(fd.get('price')),
                category: fd.get('category'),
                available: true
              });
            }} className="space-y-3 text-[13px]">
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Dish Title</label>
                <input required name="name" defaultValue={editItem?.name || ''} placeholder="e.g. Totot Special Kitfo" className="bento-input w-full p-2 rounded" />
              </div>
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Description</label>
                <textarea required name="desc" defaultValue={editItem?.description || ''} rows="2" placeholder="Ingredients and preparation..." className="bento-input w-full p-2 rounded" />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Price (ETB)</label>
                  <input required name="price" type="number" defaultValue={editItem?.price || 450} className="bento-input w-full p-2 rounded font-mono font-bold" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold uppercase tracking-wider mb-1">Category</label>
                  <select name="category" defaultValue={editItem?.category || 'specialties'} className="bento-input w-full p-2 rounded">
                    <option value="specialties">Specialties</option>
                    <option value="sides">Sides</option>
                    <option value="drinks">Drinks & Coffee</option>
                  </select>
                </div>
              </div>
              <div className="flex justify-end gap-2 pt-3 border-t border-[#1A1A1A]/10">
                <button type="button" onClick={() => { setMenuModalOpen(false); setEditItem(null); }} className="px-4 py-2 border border-[#1A1A1A]/20 rounded text-[11px] font-bold uppercase">Cancel</button>
                <button type="submit" className="px-5 py-2 bg-[#1A1A1A] text-[#FDFCF5] rounded text-[11px] font-bold uppercase">Save</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* MODAL 3: RESERVATION DETAILS */}
      {resDetails && (
        <div className="fixed inset-0 bg-[#1A1A1A]/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-[#FDFCF5] border border-[#1A1A1A]/15 rounded-md w-full max-w-sm p-6 space-y-4 shadow-xl">
            <div className="border-b border-[#1A1A1A]/10 pb-3">
              <div className="text-[10px] font-bold uppercase tracking-wider text-[#1A1A1A]/50">Reservation Record</div>
              <h3 className="font-serif italic text-[20px] font-bold">{resDetails.customerName}</h3>
              <p className="font-mono text-[12px] text-[#1A1A1A]/70">{resDetails.contactPhone}</p>
            </div>
            <div className="space-y-2 text-[13px]">
              <div><strong>Party Size:</strong> {resDetails.partySize} Guests</div>
              <div><strong>Date & Time:</strong> {resDetails.date} at {resDetails.time}</div>
              <div><strong>Special Requests:</strong> <em>"{resDetails.specialRequests || 'None'}"</em></div>
              <div><strong>Status:</strong> <span className="font-bold">{resDetails.status}</span></div>
            </div>
            <div className="flex justify-between items-center pt-3 border-t border-[#1A1A1A]/10">
              <button
                onClick={() => handleDeleteReservation(resDetails.id)}
                className="text-[11px] font-bold uppercase text-red-700 hover:underline"
              >
                Delete
              </button>
              <button
                onClick={() => setResDetails(null)}
                className="px-4 py-1.5 bg-[#1A1A1A] text-[#FDFCF5] rounded text-[11px] font-bold uppercase"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL 4: FIREBASE MULTI-SITE BRIDGE MODAL */}
      {firebaseModalOpen && (
        <div className="fixed inset-0 bg-[#1A1A1A]/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-[#FDFCF5] border border-[#1A1A1A]/15 rounded-md w-full max-w-lg p-6 space-y-4 shadow-xl text-[13px]">
            <h3 className="font-serif italic text-[20px]">Firebase Multi-Site Connection</h3>
            <p className="text-[#1A1A1A]/70 leading-relaxed">
              This console is linked to <strong>{firebaseConfig.projectId}</strong>. Bookings from your consumer website flow directly here in real time.
            </p>
            <div className="p-3 bg-[#EFECE5] rounded font-mono text-[11px] space-y-1">
              <div>Collections Active: <strong>reservations</strong>, <strong>menu_items</strong></div>
              <div>Live Snapshot Listeners: <strong>Active</strong></div>
            </div>
            <div className="flex justify-end pt-2">
              <button
                onClick={() => setFirebaseModalOpen(false)}
                className="px-5 py-2 bg-[#1A1A1A] text-[#FDFCF5] rounded text-[11px] font-bold uppercase"
              >
                Done
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Mount the App
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
