  <!-- Complete Embedded Design System & Granular Styles -->
  <style>
    :root {
      --paper-bg: #FDFCF5;
      --paper-card: #FFFFFF;
      --paper-secondary: #EFECE5;
      --paper-muted: #F5F3EB;
      --charcoal: #1A1A1A;
      --charcoal-light: #2A2A2A;
      --charcoal-hover: #333333;
      --gold: #C5A059;
      --gold-light: #DFBA73;
      --gold-dark: #9A7734;
      --border-light: rgba(26, 26, 26, 0.1);
      --border-[#1A1A1A]: rgba(26, 26, 26, 0.25);
      --shadow-sm: 0 1px 3px rgba(26, 26, 26, 0.04);
      --shadow-md: 0 4px 12px rgba(26, 26, 26, 0.06);
      --shadow-lg: 0 10px 30px -10px rgba(26, 26, 26, 0.12);
    }

    /* Standard Reset & Typography */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--paper-bg);
      color: var(--charcoal);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4, h5, h6, .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }

    /* Custom Component Class Library */
    .cms-container {
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    .bento-card {
      background-color: var(--paper-card);
      border: 1px solid var(--border-light);
      border-radius: 0.75rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-sm);
    }

    .bento-card:hover {
      border-color: var(--border-[#1A1A1A]);
      box-shadow: var(--shadow-lg);
    }

    .bento-card-static {
      background-color: var(--paper-card);
      border: 1px solid var(--border-light);
      border-radius: 0.75rem;
      box-shadow: var(--shadow-sm);
    }

    .bento-input {
      background-color: #FFFFFF;
      border: 1px solid rgba(26, 26, 26, 0.18);
      color: var(--charcoal);
      transition: all 0.2s ease-in-out;
      border-radius: 0.375rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      width: 100%;
    }

    .bento-input:focus {
      border-color: var(--charcoal);
      outline: none;
      box-shadow: 0 0 0 2px rgba(26, 26, 26, 0.1);
    }

    .bento-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(26, 26, 26, 0.7);
      margin-bottom: 0.375rem;
    }

    .btn-primary {
      background-color: var(--charcoal);
      color: var(--paper-bg);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 1.25rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      items-center: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary:hover {
      background-color: var(--charcoal-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--paper-secondary);
      color: var(--charcoal);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 1.25rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: #E2DDD2;
    }

    .btn-danger {
      background-color: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FCA5A5;
      font-weight: 600;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-danger:hover {
      background-color: #FEE2E2;
    }

    .badge-specialties {
      background-color: rgba(197, 160, 89, 0.15);
      color: #7A6438;
      border: 1px solid rgba(197, 160, 89, 0.3);
    }

    .badge-sides {
      background-color: #ECFDF5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }

    .badge-drinks {
      background-color: #EFF6FF;
      color: #1E40AF;
      border: 1px solid #BFDBFE;
    }

    .badge-[#EFECE5] {
      background-color: #F3F4F6;
      color: #374151;
      border: 1px solid #E5E7EB;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--paper-bg);
    }

    ::-webkit-scrollbar-thumb {
      background-color: rgba(26, 26, 26, 0.2);
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(26, 26, 26, 0.4);
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      display: inline-block;
    }
  </style>
</head>

    /* --- Sub-Component 1: Top Navigation Bar --- */
    const Navbar = ({ activeTab, setActiveTab, isConnected, pendingOrdersCount }) => {
      return (
        <header className="bg-[#1A1A1A] text-[#FDFCF5] sticky top-0 z-50 border-b border-[#1A1A1A]/30 shadow-md">
          <div className="cms-container py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <span className="material-symbols-outlined text-4xl text-[#C5A059]">restaurant_menu</span>

              <button

                Live Orders
                {pendingOrdersCount > 0 && (

                )}
              </button>

              <button
                onClick={() => setActiveTab('analytics')}
                className={`px-4 py-2 rounded-md text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-2 ${
                  activeTab === 'analytics' ? 'bg-[#C5A059] text-[#1A1A1A] shadow' : 'text-[#FDFCF5]/70 hover:text-white'
                }`}
              >
                <span className="material-symbols-outlined text-sm">analytics</span>
                Analytics Hub
              </button>
            </nav>

            {/* Realtime Status Indicator */}

              <div className="flex items-center gap-2 bg-[#2A2A2A] px-3.5 py-1.5 rounded-full border border-[#C5A059]/20">
                <span className={`w-2.5 h-2.5 rounded-full ${isConnected ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'}`}></span>
                <span className="text-xs font-semibold tracking-wider uppercase text-[#FDFCF5]">
                  {isConnected ? 'Firebase Live' : 'Offline Mode'}

    };

    /* --- Sub-Component 2: Status Category Pill --- */
    const CategoryBadge = ({ category }) => {
      const styles = {
        specialties: 'badge-specialties',
        sides: 'badge-sides',
        drinks: 'badge-drinks'
      };

      const labels = {
        specialties: 'Specialty',
        sides: 'Side Dish',
        drinks: 'Beverage'
      };

      return (
        <span className={`text-[10px] uppercase font-extrabold tracking-wider px-2.5 py-1 rounded-full ${styles[category] || 'badge-[#EFECE5]'}`}>
          {labels[category] || category}
        </span>
      );
    };

    /* --- Sub-Component 3: Form Editor Component --- */
    const MenuItemForm = ({ form, setForm, handleSubmit, editingId, handleCancel }) => {
      return (
        <div className="bento-card-static p-6 sticky top-28">
          <div className="flex items-center justify-between pb-4 mb-5 border-b border-[#1A1A1A]/10">
            <div>
              <h2 className="font-serif italic text-xl font-bold text-[#1A1A1A]">
                {editingId ? 'Edit Dish Details' : 'Add New Dish'}
              </h2>
              <p className="text-xs text-[#1A1A1A]/60">Update catalog items for real-time customer site sync</p>
            </div>
            {editingId && (
              <span className="text-xs font-bold px-2.5 py-1 bg-[#C5A059]/20 text-[#7A6438] rounded-full border border-[#C5A059]/40">
                Edit Mode
              </span>
            )}
          </div>

          <form onSubmit={handleSubmit} className="flex flex-col gap-4">
            <div>
              <label className="bento-label">Dish / Item Title *</label>
              <input 
                type="text" 
                required 
                value={form.name} 
                onChange={e => setForm({...form, name: e.target.value})} 
                className="bento-input font-medium" 
                placeholder="e.g. Special Kitfo Leb Leb"
              />
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="bento-label">Category *</label>
                <select 
                  value={form.category} 
                  onChange={e => setForm({...form, category: e.target.value})}
                  className="bento-input font-medium bg-white cursor-pointer"
                >
                  <option value="specialties">Specialties</option>
                  <option value="sides">Sides & Appetizers</option>
                  <option value="drinks">Drinks & Coffee</option>
                </select>
              </div>

              <div>
                <label className="bento-label">Spicy Level</label>
                <select 
                  value={form.spicyLevel || 'Mild'} 
                  onChange={e => setForm({...form, spicyLevel: e.target.value})}
                  className="bento-input font-medium bg-white cursor-pointer"
                >
                  <option value="None">None</option>
                  <option value="Mild">Mild</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High (Mitmita)</option>
                </select>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="bento-label">Selling Price (ETB) *</label>
                <input 
                  type="number" 
                  required 
                  min="0"
                  value={form.price} 
                  onChange={e => setForm({...form, price: e.target.value})} 
                  className="bento-input font-medium" 
                  placeholder="e.g. 550"
                />
              </div>

              <div>
                <label className="bento-label">Unit Cost (ETB)</label>
                <input 
                  type="number" 
                  min="0"
                  value={form.cost || ''} 
                  onChange={e => setForm({...form, cost: e.target.value})} 
                  className="bento-input font-medium" 
                  placeholder="e.g. 220"
                />
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="bento-label">Available Stock</label>
                <input 
                  type="number" 
                  min="0"
                  value={form.stock || ''} 
                  onChange={e => setForm({...form, stock: e.target.value})} 
                  className="bento-input font-medium" 
                  placeholder="e.g. 50"
                />
              </div>

              <div>
                <label className="bento-label">Prep Time (Mins)</label>

                  type="number" 
                  min="1"
                  value={form.preparationTime || ''} 
                  onChange={e => setForm({...form, preparationTime: e.target.value})} 
                  className="bento-input font-medium" 
                  placeholder="e.g. 15"
                />
              </div>
            </div>

            <div>
              <label className="bento-label">Recipe & Ingredients Description</label>
              <textarea 
                rows="3" 
                value={form.description} 
                onChange={e => setForm({...form, description: e.target.value})}

            <div className="flex items-center gap-3 p-3 bg-[#FDFCF5] rounded border border-[#1A1A1A]/10">

    /* --- Sub-Component 4: Individual Item Display Card --- */
    const ItemCard = ({ item, handleEdit, handleDelete, toggleVisibility }) => {
      const margin = useMemo(() => {
        if (!item.price || !item.cost) return null;
        const profit = item.price - item.cost;
        const marginPct = ((profit / item.price) * 100).toFixed(0);
        return { profit, marginPct };
      }, [item.price, item.cost]);

      return (
        <div className={`bento-card p-5 transition-all ${!item.available ? 'bg-gray-50/70 opacity-75' : ''}`}>
          <div className="flex items-start justify-between gap-4">
            <div className="flex-1">
              <div className="flex items-center gap-2 flex-wrap mb-1">
                <h3 className="font-serif font-bold text-lg text-[#1A1A1A]">{item.name}</h3>
                <CategoryBadge category={item.category || 'specialties'} />
                {item.spicyLevel && item.spicyLevel !== 'None' && (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-50 text-rose-700 border border-rose-200">
                    🔥 {item.spicyLevel}
                  </span>
                )}
              </div>

              <p className="text-xs text-[#1A1A1A]/70 leading-relaxed mb-3">
                {item.description || 'No detailed recipe description provided.'}
              </p>

              <div className="flex flex-wrap items-center gap-4 text-xs font-medium text-[#1A1A1A]/80 border-t border-[#1A1A1A]/5 pt-3">
                <div className="bg-[#C5A059]/10 px-3 py-1 rounded border border-[#C5A059]/30">
                  <span className="text-[#1A1A1A]/60 font-semibold mr-1">Price:</span>
                  <span className="font-extrabold text-[#C5A059]">{item.price} ETB</span>
                </div>

                {margin && (
                  <div className="bg-emerald-50 px-2.5 py-1 rounded border border-emerald-200 text-emerald-800">
                    <span className="font-semibold">Profit:</span> +{margin.profit} ETB ({margin.marginPct}%)
                  </div>
                )}

                {item.stock !== undefined && (
                  <div className={`px-2.5 py-1 rounded border ${item.stock < 10 ? 'bg-rose-50 border-rose-200 text-rose-700 font-bold' : 'bg-gray-100 border-gray-200 text-gray-700'}`}>
                    <span>Stock: {item.stock} {item.unit || 'units'}</span>
                  </div>
                )}
              </div>
            </div>

            {/* Quick Action Buttons */}
            <div className="flex flex-col gap-2">
              <button
                onClick={() => toggleVisibility(item)}
                className={`p-2 rounded border transition-colors ${
                  item.available 
                    ? 'bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100' 
                    : 'bg-rose-50 border-rose-200 text-rose-700 hover:bg-rose-100'
                }`}
                title={item.available ? 'Hide from Menu' : 'Show on Menu'}
              >
                <span className="material-symbols-outlined text-lg">
                  {item.available ? 'visibility' : 'visibility_off'}
                </span>
              </button>

              <button
                onClick={() => handleEdit(item)}
                className="p-2 rounded border border-[#1A1A1A]/15 bg-[#EFECE5] text-[#1A1A1A] hover:bg-[#E2DDD2] transition-colors"
                title="Edit Item"
              >
                <span className="material-symbols-outlined text-lg">edit</span>
              </button>

              <button
                onClick={() => handleDelete(item.id)}
                className="p-2 rounded border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors"
                title="Delete Item"
              >
                <span className="material-symbols-outlined text-lg">delete</span>
              </button>
            </div>
          </div>
        </div>
      );
    };

    /* --- Sub-Component 5: Live Orders View --- */
    const OrdersManager = ({ orders, updateOrderStatus }) => {
      const [statusFilter, setStatusFilter] = useState('all');

      const filteredOrders = useMemo(() => {
        if (statusFilter === 'all') return orders;
        return orders.filter(o => o.status.toLowerCase() === statusFilter.toLowerCase());
      }, [orders, statusFilter]);

      return (
        <div className="flex flex-col gap-6">
          <div className="bento-card-static p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="font-serif italic text-2xl font-bold text-[#1A1A1A]">Incoming Table & Takeout Orders</h2>
              <p className="text-xs text-[#1A1A1A]/60">Real-time point of sale kitchen orders feed</p>
            </div>

            {/* Order Status Filters */}
            <div className="flex gap-2 bg-[#EFECE5] p-1.5 rounded-lg border border-[#1A1A1A]/10">
              {['all', 'pending', 'preparing', 'completed'].map(st => (
                <button
                  key={st}
                  onClick={() => setStatusFilter(st)}
                  className={`px-3 py-1.5 rounded text-xs font-bold uppercase tracking-wider transition-all ${
                    statusFilter === st ? 'bg-white text-[#1A1A1A] shadow-sm' : 'text-[#1A1A1A]/60 hover:text-[#1A1A1A]'
                  }`}
                >
                  {st}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filteredOrders.map(ord => (
              <div key={ord.id} className="bento-card p-6 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between border-b border-[#1A1A1A]/10 pb-3 mb-3">
                    <div>
                      <span className="text-xs font-extrabold text-[#C5A059] uppercase tracking-wider">{ord.tableNumber}</span>
                      <h3 className="font-serif font-bold text-lg text-[#1A1A1A]">{ord.customerName}</h3>
                    </div>
                    <span className={`text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider ${
                      ord.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' :
                      ord.status === 'Preparing' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'
                    }`}>
                      {ord.status}
                    </span>
                  </div>

                  {/* Order Items List */}
                  <div className="flex flex-col gap-2 mb-4">
                    {ord.items.map((it, idx) => (
                      <div key={idx} className="flex justify-between text-sm font-medium">
                        <span>{it.quantity}x {it.name}</span>
                        <span className="font-bold">{it.price * it.quantity} ETB</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="border-t border-[#1A1A1A]/10 pt-3 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-[#1A1A1A]/50 block">Total Bill ({ord.paymentType})</span>
                    <span className="text-lg font-extrabold text-[#1A1A1A]">{ord.totalAmount} ETB</span>
                  </div>

                  <div className="flex items-center gap-2">
                    {ord.status === 'Pending' && (
                      <button 
                        onClick={() => updateOrderStatus(ord.id, 'Preparing')}
                        className="btn-primary text-xs py-2 px-3"
                      >
                        Start Preparing
                      </button>
                    )}
                    {ord.status === 'Preparing' && (
                      <button 
                        onClick={() => updateOrderStatus(ord.id, 'Completed')}
                        className="bg-emerald-700 text-white font-bold text-xs py-2 px-3 rounded hover:bg-emerald-800 transition-colors"
                      >
                        Mark Completed
                      </button>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    /* --- Sub-Component 6: Analytics & Revenue Dashboard --- */
    const AnalyticsDashboard = ({ menuItems, orders }) => {
      const metrics = useMemo(() => {
        const totalRevenue = orders.reduce((acc, o) => acc + o.totalAmount, 0);
        const totalItemsSold = orders.reduce((acc, o) => acc + o.items.reduce((iAcc, i) => iAcc + i.quantity, 0), 0);
        const avgOrderValue = orders.length ? (totalRevenue / orders.length).toFixed(0) : 0;
        const totalInventoryValue = menuItems.reduce((acc, i) => acc + ((i.stock || 0) * (i.price || 0)), 0);

        return { totalRevenue, totalItemsSold, avgOrderValue, totalInventoryValue };
      }, [menuItems, orders]);

      return (
        <div className="flex flex-col gap-6">
          <div className="bento-card-static p-6">
            <h2 className="font-serif italic text-2xl font-bold text-[#1A1A1A]">Executive Financial Overview</h2>
            <p className="text-xs text-[#1A1A1A]/60">Real-time performance indicators & inventory valuation</p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bento-card p-5">
              <span className="material-symbols-outlined text-3xl text-[#C5A059] mb-2">payments</span>
              <span className="bento-label">Gross Revenue</span>
              <h3 className="text-2xl font-extrabold text-[#1A1A1A]">{metrics.totalRevenue.toLocaleString()} ETB</h3>
              <span className="text-[11px] text-emerald-700 font-semibold mt-1 inline-block">↑ 14% vs last week</span>
            </div>

            <div className="bento-card p-5">
              <span className="material-symbols-outlined text-3xl text-emerald-700 mb-2">shopping_bag</span>
              <span className="bento-label">Total Items Sold</span>
              <h3 className="text-2xl font-extrabold text-[#1A1A1A]">{metrics.totalItemsSold}</h3>
              <span className="text-[11px] text-emerald-700 font-semibold mt-1 inline-block">Across {orders.length} orders</span>
            </div>

            <div className="bento-card p-5">
              <span className="material-symbols-outlined text-3xl text-blue-700 mb-2">receipt</span>
              <span className="bento-label">Average Ticket Size</span>
              <h3 className="text-2xl font-extrabold text-[#1A1A1A]">{metrics.avgOrderValue} ETB</h3>
              <span className="text-[11px] text-[#1A1A1A]/60 mt-1 inline-block">Per table receipt</span>
            </div>

            <div className="bento-card p-5">
              <span className="material-symbols-outlined text-3xl text-purple-700 mb-2">inventory_2</span>
              <span className="bento-label">Stock Asset Value</span>
              <h3 className="text-2xl font-extrabold text-[#1A1A1A]">{metrics.totalInventoryValue.toLocaleString()} ETB</h3>
              <span className="text-[11px] text-[#1A1A1A]/60 mt-1 inline-block">{menuItems.length} menu items active</span>
            </div>
          </div>
        </div>
      );
    };

    /* --- Root Main Component --- */
    function AdminApp() {
      const [activeTab, setActiveTab] = useState('menu');
      const [menuItems, setMenuItems] = useState(SEED_MENU_ITEMS);
      const [orders, setOrders] = useState(SEED_ORDERS);
      const [isConnected, setIsConnected] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('all');

      const [form, setForm] = useState({
        name: '',
        category: 'specialties',
        price: '',
        cost: '',
        stock: '',
        unit: 'servings',
        description: '',
        available: true,
        preparationTime: '',
        spicyLevel: 'Mild'
      });

      /* --- Firebase Live Synchronization --- */
      useEffect(() => {
        const checkBridge = setInterval(() => {
          if (window.FirebaseBridge) {
            clearInterval(checkBridge);
            const { db, ref, onValue, set } = window.FirebaseBridge;
            
            // Sync Menu Items
            const menuRef = ref(db, 'menu');
            onValue(menuRef, (snapshot) => {
              setIsConnected(true);
              const data = snapshot.val();
              if (data) {
                const parsed = Object.entries(data).map(([key, val]) => ({ id: key, ...val }));
                setMenuItems(parsed);
              } else {
                SEED_MENU_ITEMS.forEach(it => set(ref(db, 'menu/' + it.id), it));
              }
            }, () => setIsConnected(false));

            // Sync Orders
            const ordersRef = ref(db, 'orders');
            onValue(ordersRef, (snapshot) => {
              const data = snapshot.val();
              if (data) {
                const parsedOrders = Object.entries(data).map(([key, val]) => ({ id: key, ...val }));
                setOrders(parsedOrders);
              }
            });
          }
        }, 150);

        return () => clearInterval(checkBridge);
      }, []);

      /* --- Form Actions --- */
      const handleSubmit = (e) => {
        e.preventDefault();
        
        const payload = {
          name: form.name,
          category: form.category,
          price: Number(form.price),
          cost: Number(form.cost) || 0,
          stock: Number(form.stock) || 0,
          unit: form.unit || 'servings',
          description: form.description,
          available: Boolean(form.available),
          preparationTime: Number(form.preparationTime) || 10,
          spicyLevel: form.spicyLevel || 'Mild'
        };

        if (window.FirebaseBridge) {
          const { db, ref, set, push } = window.FirebaseBridge;
          if (editingId) {
            set(ref(db, 'menu/' + editingId), payload);
            setEditingId(null);
          } else {
            const newRef = push(ref(db, 'menu'));
            set(newRef, payload);
          }
        } else {
          // Local fallback
          if (editingId) {
            setMenuItems(prev => prev.map(i => i.id === editingId ? { ...payload, id: editingId } : i));
            setEditingId(null);
          } else {
            setMenuItems(prev => [...prev, { ...payload, id: 'item-' + Date.now() }]);
          }
        }

        handleCancel();
      };

      const handleEdit = (item) => {
        setEditingId(item.id);
        setForm({
          name: item.name || '',
          category: item.category || 'specialties',
          price: item.price || '',
          cost: item.cost || '',
          stock: item.stock || '',
          unit: item.unit || 'servings',
          description: item.description || '',
          available: item.available !== false,
          preparationTime: item.preparationTime || '',
          spicyLevel: item.spicyLevel || 'Mild'
        });
      };

      const handleDelete = (id) => {
        if (confirm('Are you sure you want to delete this dish from the menu?')) {
          if (window.FirebaseBridge) {
            const { db, ref, remove } = window.FirebaseBridge;
            remove(ref(db, 'menu/' + id));
          } else {
            setMenuItems(prev => prev.filter(i => i.id !== id));
          }
          if (editingId === id) handleCancel();
        }
      };

      const toggleVisibility = (item) => {
        const updatedStatus = !item.available;
        if (window.FirebaseBridge) {
          const { db, ref, update } = window.FirebaseBridge;
          update(ref(db, 'menu/' + item.id), { available: updatedStatus });
        } else {
          setMenuItems(prev => prev.map(i => i.id === item.id ? { ...i, available: updatedStatus } : i));
        }
      };

      const updateOrderStatus = (orderId, newStatus) => {
        if (window.FirebaseBridge) {
          const { db, ref, update } = window.FirebaseBridge;
          update(ref(db, 'orders/' + orderId), { status: newStatus });
        } else {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        }
      };

      const handleCancel = () => {
        setEditingId(null);
        setForm({
          name: '',
          category: 'specialties',
          price: '',
          cost: '',
          stock: '',
          unit: 'servings',
          description: '',
          available: true,
          preparationTime: '',
          spicyLevel: 'Mild'
        });
      };

      const filteredMenuItems = useMemo(() => {
        return menuItems.filter(item => {
          const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                               (item.description && item.description.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchesCat = categoryFilter === 'all' || item.category === categoryFilter;
          return matchesSearch && matchesCat;
        });
      }, [menuItems, searchTerm, categoryFilter]);

      const pendingOrdersCount = useMemo(() => orders.filter(o => o.status === 'Pending').length, [orders]);

      return (
        <div className="min-h-screen flex flex-col bg-[#FDFCF5]">
          <Navbar 
            activeTab={activeTab} 
            setActiveTab={setActiveTab} 
            isConnected={isConnected} 
            pendingOrdersCount={pendingOrdersCount} 
          />

          <main className="cms-container py-8 flex-1">
            {activeTab === 'menu' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                {/* Form Column */}
                <div className="lg:col-span-5">
                  <MenuItemForm 
                    form={form} 
                    setForm={setForm} 
                    handleSubmit={handleSubmit} 
                    editingId={editingId} 
                    handleCancel={handleCancel} 
                  />
                </div>

                {/* Listing Column */}
                <div className="lg:col-span-7 flex flex-col gap-5">
                  {/* Search and Filter Controls */}
                  <div className="bento-card-static p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div className="relative w-full sm:w-64">
                      <span className="material-symbols-outlined absolute left-3 top-2.5 text-lg text-[#1A1A1A]/40">search</span>
                      <input 
                        type="text" 
                        value={searchTerm} 
                        onChange={e => setSearchTerm(e.target.value)}
                        placeholder="Search menu items..." 
                        className="bento-input pl-9 text-xs"
                      />
                    </div>

                    <div className="flex gap-1 bg-[#EFECE5] p-1 rounded-lg w-full sm:w-auto overflow-x-auto">
                      {['all', 'specialties', 'sides', 'drinks'].map(cat => (
                        <button
                          key={cat}
                          onClick={() => setCategoryFilter(cat)}
                          className={`px-3 py-1.5 rounded text-[11px] font-bold uppercase tracking-wider transition-all ${
                            categoryFilter === cat ? 'bg-white text-[#1A1A1A] shadow-sm' : 'text-[#1A1A1A]/60 hover:text-[#1A1A1A]'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* List View */}
                  {filteredMenuItems.length === 0 ? (
                    <div className="bento-card-static p-12 text-center text-[#1A1A1A]/50">
                      <span className="material-symbols-outlined text-4xl mb-2">no_meals</span>
                      <p className="text-sm font-medium">No menu items match your search filters.</p>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-3">
                      {filteredMenuItems.map(item => (
                        <ItemCard 
                          key={item.id} 
                          item={item} 
                          handleEdit={handleEdit} 
                          handleDelete={handleDelete} 
                          toggleVisibility={toggleVisibility} 
                        />
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'orders' && (
              <OrdersManager orders={orders} updateOrderStatus={updateOrderStatus} />
            )}

            {activeTab === 'analytics' && (
              <AnalyticsDashboard menuItems={menuItems} orders={orders} />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
